name: company-brain
x-backend: &backend
  image: company-brain-backend:local
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  environment:
    DATABASE_URL: postgresql+psycopg://brain:brain-local@db:5432/brain
    ARTIFACT_ROOT: /artifacts
    COMPANY_BRAIN_LOCAL_DEMO: "1"
  volumes:
    - artifacts:/artifacts

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: brain
      POSTGRES_USER: brain
      POSTGRES_PASSWORD: brain-local
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "brain", "-d", "brain"]
      interval: 2s
      timeout: 3s
      retries: 25
  migrate:
    <<: *backend
    command: ["alembic", "-c", "apps/api/alembic.ini", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  api:
    <<: *backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
  worker:
    <<: *backend
    command: ["python", "apps/worker/main.py"]
    depends_on:
      migrate:
        condition: service_completed_successfully
  web:
    build: apps/web
    ports:
      - "127.0.0.1:${BRAIN_WEB_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy
volumes:
  database:
  artifacts:
